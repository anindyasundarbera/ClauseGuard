# Render Blueprint: static-site MIRROR of the Firebase Hosting deployment (see docs/deploy.md).
# Contains NO secrets. Every VITE_* value below is a PUBLIC build-time identifier (it ships inside the
# JS bundle by design). They are declared with `sync: false`, so Render asks for the value in the
# dashboard and nothing is stored in this file. Leave them empty to run in local/practice mode.
services:
  - type: web
    runtime: static
    name: clauseguard-hybrid
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Single-page app: unknown paths fall back to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Keep in sync with firebase.json "headers".
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public Firebase Web config (Firebase Console > Project settings > Your apps). Not secrets.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      # Public reCAPTCHA Enterprise site key used for App Check. The Render domain must be allowed on this key.
      - key: VITE_RECAPTCHA_ENTERPRISE_SITE_KEY
        sync: false
      # Optional overrides (leave empty for defaults).
      - key: VITE_FIREBASE_CLOUD_MODEL
        sync: false
      - key: VITE_FIREBASE_USE_LIMITED_USE_APPCHECK
        sync: false
      # NOTE: VITE_FIREBASE_APPCHECK_DEBUG_TOKEN is deliberately NOT declared. Debug tokens are localhost-only
      # and must never be set on a hosted service.
